[package]
name = "loudnorm"
version = "0.4.0"
edition = "2024"

[dependencies]
eframe = "0.37"
egui_extras = "0.37"
rfd = "0.18"
symphonia = { version = "0.6", features = ["all"] }
ebur128 = "0.1.11"
lofty = "0.25"
walkdir = "2.5"
rayon = "1.12"
anyhow = "1"
ttf-parser = "0.25"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
opt-level = 3
strip = true
