# Branch pushes: build and test every platform (same jobs as a release, without publishing), only when
# the push changes the code, its dependencies or the build itself; CI- or docs-only pushes skip it.
# Pull requests: compare the version in Cargo.toml with the latest release (main).
# develop -> main pull requests: also preview the release notes the merge will publish.
name: CI

on:
  push:
    branches-ignore: [main]
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/build.yml
  pull_request:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yml

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare version with main (the latest release)
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          get() { sed -n 's/^version = "\(.*\)"/\1/p' | head -n1; }
          # Cargo.toml of the merge result (actions/checkout uses refs/pull/N/merge), so a pull request
          # into develop passes when develop already holds the bumped, not yet released version.
          head_v=$(get < Cargo.toml)
          main_v=$(git show origin/main:Cargo.toml | get)
          echo "main $main_v -> merged $head_v (into $BASE_REF)"
          # SemVer precedence (pre-releases sort below the release; build metadata is ignored).
          order=$(python3 .github/scripts/semver_cmp.py "$main_v" "$head_v")
          case "$order" in
            eq)
              if [[ "$BASE_REF" == main && "$HEAD_REF" == develop ]]; then
                echo "::error file=Cargo.toml::Version $head_v is already released; bump it on develop before merging into main."
                exit 1
              fi
              echo "::warning file=Cargo.toml::Version is still $head_v, as on main. Bump it above the latest release unless this PR only touches CI/docs: patch = fixes, minor = features, major = drastic UI/algorithm changes." ;;
            down) echo "::error file=Cargo.toml::Version $head_v is lower than $main_v on main."; exit 1 ;;
            up) ;;
            *) echo "::error file=Cargo.toml::Cannot compare versions ($main_v, $head_v): $order"; exit 1 ;;
          esac

  release-notes:
    # Pull requests from forks get a read-only token, which the generate-notes API refuses.
    if: >-
      github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by the generate-notes API; it only returns text and creates nothing
    steps:
      - uses: actions/checkout@v7
      - name: Preview release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          {
            echo "## Release notes preview for v$v"
            echo
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="v$v" -f target_commitish="${{ github.event.pull_request.head.sha }}" --jq .body
          } >> "$GITHUB_STEP_SUMMARY"
